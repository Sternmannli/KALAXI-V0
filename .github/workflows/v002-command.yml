name: V-002 Command

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON payload with action + params'
        required: true
        type: string

permissions:
  issues: write
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Execute command on kalam.ch
        env:
          COMMAND_KEY: ${{ secrets.COMMAND_KEY }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          echo "Sending command to kalam.ch..."
          RESPONSE=$(curl -s -w "\n---HTTP_CODE:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${COMMAND_KEY}" \
            -d "${PAYLOAD}" \
            --max-time 60 \
            "https://kalam.ch/api/command.php" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/---HTTP_CODE/d')

          echo "HTTP Status: ${HTTP_CODE}"
          echo "${BODY}" > output.json

          # Pretty print if jq available
          if command -v jq &> /dev/null; then
            cat output.json | jq . 2>/dev/null || cat output.json
          else
            cat output.json
          fi

      - name: Post result as issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '(no output)';
            try { output = fs.readFileSync('output.json', 'utf8'); } catch(e) {}

            // Parse action from payload
            let action = 'unknown';
            try {
              const payload = JSON.parse(process.env.PAYLOAD || '{}');
              action = payload.action || 'unknown';
            } catch(e) {}

            // Truncate if too long
            if (output.length > 60000) {
              output = output.substring(0, 60000) + '\n\n... (truncated)';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `V-002 Command: ${action}`,
              body: `**Action:** \`${action}\`\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`json\n${output}\n\`\`\``,
              labels: ['v002-command']
            });
        env:
          PAYLOAD: ${{ inputs.payload }}
