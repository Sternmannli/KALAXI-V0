name: Auto-Tend Threshold

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tending script
        run: python .github/scripts/tend.py --thermal-check

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add KALAXI_A_FOUNDATION.txt THRESHOLD.md MANIFEST/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto-tend: process ready seeds from THRESHOLD.md"
          git push