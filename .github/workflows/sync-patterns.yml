name: Sync Site Patterns

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch site patterns
        env:
          EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
        run: |
          mkdir -p KEEP/SITE_PATTERNS
          DATE=$(date -u +%Y-%m-%d)

          RESPONSE=$(curl -sf "https://kalam.ch/api/export.php?key=${EXPORT_KEY}" || echo "")

          if [ -z "$RESPONSE" ]; then
            echo "::warning::Could not fetch site patterns — site may not be live yet"
            exit 0
          fi

          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")

          if [ "$STATUS" = "no-data" ]; then
            echo "No data available yet. Skipping."
            exit 0
          fi

          # Save daily snapshot
          echo "$RESPONSE" | python3 -m json.tool > "KEEP/SITE_PATTERNS/patterns_${DATE}.json"

          # Update latest
          echo "$RESPONSE" | python3 -m json.tool > "KEEP/SITE_PATTERNS/latest.json"

          echo "Patterns fetched for ${DATE}"

      - name: Commit if changed
        run: |
          git config user.name "V-002 [Organism]"
          git config user.email "axi@kalam.ch"

          git add KEEP/SITE_PATTERNS/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new pattern data. The organism rests."
          else
            git commit -m "[V-002 SYNC] Site patterns $(date -u +%Y-%m-%d)"
            git push
          fi
