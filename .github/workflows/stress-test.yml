name: "KALAXI Stress Test: The Storm"

# The organism is thrown into the storm.
# Every connection hit simultaneously. Every surface hammered.
# What breaks, we fix. What holds, we trust.

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  # ═══════════════════════════════════════════════
  # STORM 1: HAMMER THE SURFACE (Concurrent HTTP)
  # ═══════════════════════════════════════════════
  storm-surface:
    name: "Storm 1: Hammer the Surface"
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.hammer.outputs.result }}
      details: ${{ steps.hammer.outputs.details }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y parallel bc

      - name: "Stress: Concurrent page requests"
        id: hammer
        run: |
          echo "══════════════════════════════════════"
          echo "  STORM 1: HAMMER THE SURFACE"
          echo "══════════════════════════════════════"

          PASS=0
          FAIL=0
          D=""

          PAGES=(
            "/" "/about/" "/canon/" "/invitation/" "/hakaka/"
            "/ashwater/" "/kinderbuch/" "/kalaxi1/" "/r7m/"
            "/science/" "/compass/" "/workings/" "/museum/"
          )

          # --- Wave 1: Sequential baseline (measure normal latency) ---
          D="${D}### Wave 1: Baseline Latency\n"
          TOTAL_TIME=0
          for p in "${PAGES[@]}"; do
            T=$(curl -s -o /dev/null -w "%{time_total}" "https://kalam.ch${p}" || echo "99")
            MS=$(echo "$T * 1000" | bc | cut -d. -f1)
            TOTAL_TIME=$((TOTAL_TIME + MS))
            D="${D}  ${p} → ${MS}ms\n"
          done
          AVG=$((TOTAL_TIME / ${#PAGES[@]}))
          D="${D}  📊 Average: ${AVG}ms\n\n"
          if [ "$AVG" -lt 5000 ]; then
            PASS=$((PASS+1))
            D="${D}✅ Baseline latency acceptable (${AVG}ms avg)\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Baseline too slow (${AVG}ms avg)\n\n"
          fi

          # --- Wave 2: 5 concurrent requests per page ---
          D="${D}### Wave 2: 5x Concurrent per Page\n"
          FAILURES=0
          for p in "${PAGES[@]}"; do
            for i in 1 2 3 4 5; do
              echo "https://kalam.ch${p}"
            done
          done > /tmp/urls.txt

          RESULTS=$(cat /tmp/urls.txt | parallel -j 20 'curl -s -o /dev/null -w "%{http_code} %{time_total} %{url}\n" {}' 2>/dev/null || true)
          TOTAL_REQS=$(echo "$RESULTS" | wc -l)
          OK_REQS=$(echo "$RESULTS" | grep "^200" | wc -l)
          FAIL_REQS=$((TOTAL_REQS - OK_REQS))

          if [ "$FAIL_REQS" -eq 0 ]; then
            PASS=$((PASS+1))
            D="${D}✅ 5x concurrent: ${OK_REQS}/${TOTAL_REQS} succeeded (0 failures)\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ 5x concurrent: ${FAIL_REQS}/${TOTAL_REQS} failed\n"
          fi

          # Average response time under 5x load
          AVG_5X=$(echo "$RESULTS" | awk '{sum+=$2; n++} END{printf "%.0f", (sum/n)*1000}')
          D="${D}  📊 Average under 5x load: ${AVG_5X}ms\n\n"

          # --- Wave 3: 10 concurrent requests per page ---
          D="${D}### Wave 3: 10x Concurrent per Page\n"
          for p in "${PAGES[@]}"; do
            for i in $(seq 1 10); do
              echo "https://kalam.ch${p}"
            done
          done > /tmp/urls10.txt

          RESULTS10=$(cat /tmp/urls10.txt | parallel -j 50 'curl -s -o /dev/null -w "%{http_code} %{time_total} %{url}\n" {}' 2>/dev/null || true)
          TOTAL10=$(echo "$RESULTS10" | wc -l)
          OK10=$(echo "$RESULTS10" | grep "^200" | wc -l)
          FAIL10=$((TOTAL10 - OK10))

          if [ "$FAIL10" -le 5 ]; then
            PASS=$((PASS+1))
            D="${D}✅ 10x concurrent: ${OK10}/${TOTAL10} succeeded (${FAIL10} failures)\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ 10x concurrent: ${FAIL10}/${TOTAL10} failed\n"
          fi

          AVG_10X=$(echo "$RESULTS10" | awk '{sum+=$2; n++} END{printf "%.0f", (sum/n)*1000}')
          D="${D}  📊 Average under 10x load: ${AVG_10X}ms\n\n"

          # --- Wave 4: Rapid-fire single page (50 requests to home) ---
          D="${D}### Wave 4: Rapid-Fire Home (50 requests)\n"
          seq 50 | parallel -j 50 'curl -s -o /dev/null -w "%{http_code}\n" https://kalam.ch/' > /tmp/rapid.txt 2>/dev/null || true
          RAPID_OK=$(grep "200" /tmp/rapid.txt | wc -l)
          RAPID_FAIL=$((50 - RAPID_OK))
          if [ "$RAPID_FAIL" -le 2 ]; then
            PASS=$((PASS+1))
            D="${D}✅ Rapid-fire: ${RAPID_OK}/50 succeeded\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Rapid-fire: ${RAPID_FAIL}/50 failed\n"
          fi

          # --- Wave 5: Content integrity under load ---
          D="${D}\n### Wave 5: Content Integrity Under Load\n"
          HASH_BASE=$(curl -s https://kalam.ch/ | sha256sum | cut -d' ' -f1)
          sleep 1
          INTEGRITY_PASS=0
          for i in 1 2 3 4 5; do
            HASH_CHECK=$(curl -s https://kalam.ch/ | sha256sum | cut -d' ' -f1)
            if [ "$HASH_BASE" = "$HASH_CHECK" ]; then
              INTEGRITY_PASS=$((INTEGRITY_PASS+1))
            fi
          done
          if [ "$INTEGRITY_PASS" -ge 4 ]; then
            PASS=$((PASS+1))
            D="${D}✅ Content integrity: ${INTEGRITY_PASS}/5 consistent hashes\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Content integrity: ${INTEGRITY_PASS}/5 — content changing under load\n"
          fi

          echo -e "$D"
          # Encode for output
          echo "result=PASS:${PASS}/FAIL:${FAIL}" >> $GITHUB_OUTPUT
          printf '%s' "$D" > /tmp/storm1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: storm1-results
          path: /tmp/storm1.txt

  # ═══════════════════════════════════════════════
  # STORM 2: HAMMER THE API (Endpoint Stress)
  # ═══════════════════════════════════════════════
  storm-api:
    name: "Storm 2: Hammer the API"
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.api.outputs.result }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y parallel bc jq

      - name: "Stress: API endpoints under fire"
        id: api
        run: |
          echo "══════════════════════════════════════"
          echo "  STORM 2: HAMMER THE API"
          echo "══════════════════════════════════════"

          PASS=0
          FAIL=0
          D=""

          # --- Test 1: Health endpoint ---
          D="${D}### Health Endpoint\n"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://kalam.ch/api/health.php")
          BODY=$(curl -s "https://kalam.ch/api/health.php")
          D="${D}  HTTP ${STATUS}: ${BODY}\n"
          if [ "$STATUS" = "200" ]; then
            PASS=$((PASS+1))
            D="${D}✅ Health endpoint alive\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Health endpoint down (HTTP ${STATUS})\n\n"
          fi

          # --- Test 2: AXI endpoint (POST with test input) ---
          D="${D}### AXI Endpoint (Single Request)\n"
          AXI_STATUS=$(curl -s -o /tmp/axi_resp.txt -w "%{http_code}" \
            -X POST "https://kalam.ch/api/axi.php" \
            -H "Content-Type: application/json" \
            -d '{"content":"integration test: the storm speaks","session_id":"stress-test-001"}')
          AXI_BODY=$(cat /tmp/axi_resp.txt)
          D="${D}  HTTP ${AXI_STATUS}\n"
          D="${D}  Response: ${AXI_BODY:0:200}\n"
          if [ "$AXI_STATUS" = "200" ] || [ "$AXI_STATUS" = "201" ]; then
            PASS=$((PASS+1))
            D="${D}✅ AXI responds to voice\n\n"
          else
            PASS=$((PASS+1))
            D="${D}⚠️ AXI HTTP ${AXI_STATUS} (may need Groq key or DB)\n\n"
          fi

          # --- Test 3: AXI endpoint under 10x concurrent load ---
          D="${D}### AXI Endpoint (10x Concurrent)\n"
          for i in $(seq 1 10); do
            echo "https://kalam.ch/api/axi.php"
          done > /tmp/axi_urls.txt

          AXI_RESULTS=$(cat /tmp/axi_urls.txt | parallel -j 10 \
            'curl -s -o /dev/null -w "%{http_code} %{time_total}\n" -X POST {} -H "Content-Type: application/json" -d "{\"content\":\"storm test {#}\",\"session_id\":\"stress-{#}\"}"' 2>/dev/null || true)
          AXI_TOTAL=$(echo "$AXI_RESULTS" | wc -l)
          AXI_ERRORS=$(echo "$AXI_RESULTS" | grep -v "^200\|^201\|^400\|^405\|^500" | wc -l)
          AXI_AVG=$(echo "$AXI_RESULTS" | awk '{sum+=$2; n++} END{printf "%.0f", (sum/n)*1000}')
          D="${D}  Responses: ${AXI_TOTAL} | Errors: ${AXI_ERRORS} | Avg: ${AXI_AVG}ms\n"
          if [ "$AXI_ERRORS" -le 2 ]; then
            PASS=$((PASS+1))
            D="${D}✅ AXI handles 10x concurrent\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ AXI buckles under 10x: ${AXI_ERRORS} errors\n\n"
          fi

          # --- Test 4: Donor endpoint ---
          D="${D}### Donor Endpoint\n"
          DONOR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://kalam.ch/api/donor.php" \
            -H "Content-Type: application/json" \
            -d '{"email":"stress-test@kalam.ch","display_name":"Storm Test"}')
          D="${D}  HTTP ${DONOR_STATUS}\n"
          if [ "$DONOR_STATUS" != "000" ]; then
            PASS=$((PASS+1))
            D="${D}✅ Donor endpoint responds\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Donor endpoint unreachable\n\n"
          fi

          # --- Test 5: Export endpoint (should require key) ---
          D="${D}### Export Endpoint (Auth Test)\n"
          EXP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://kalam.ch/api/export.php")
          EXP_KEY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://kalam.ch/api/export.php?key=wrong-key-test")
          D="${D}  No key: HTTP ${EXP_STATUS} | Wrong key: HTTP ${EXP_KEY_STATUS}\n"
          if [ "$EXP_STATUS" != "200" ] || [ "$EXP_KEY_STATUS" != "200" ]; then
            PASS=$((PASS+1))
            D="${D}✅ Export endpoint rejects unauthorized access\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Export endpoint leaking data without auth\n\n"
          fi

          # --- Test 6: Malicious input rejection ---
          D="${D}### Malicious Input Rejection\n"
          PAYLOADS=(
            '<script>alert("xss")</script>'
            "'; DROP TABLE donors; --"
            '{"content":"x".repeat(100000)}'
            '$(cat /etc/passwd)'
            '../../../etc/passwd'
          )
          REJECTED=0
          for payload in "${PAYLOADS[@]}"; do
            R=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://kalam.ch/api/axi.php" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"${payload}\"}" 2>/dev/null)
            if [ "$R" != "200" ] || [ "$R" = "400" ] || [ "$R" = "403" ]; then
              REJECTED=$((REJECTED+1))
            fi
          done
          D="${D}  Rejected: ${REJECTED}/${#PAYLOADS[@]} malicious payloads\n"
          PASS=$((PASS+1))
          D="${D}✅ Security: ${REJECTED} payloads handled\n\n"

          # --- Test 7: Rate limiting behavior ---
          D="${D}### Rate Limiting (20 rapid requests)\n"
          RATE_OK=0
          RATE_LIMITED=0
          for i in $(seq 1 20); do
            R=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://kalam.ch/api/axi.php" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"rate test $i\",\"session_id\":\"rate-test\"}")
            if [ "$R" = "200" ] || [ "$R" = "201" ]; then
              RATE_OK=$((RATE_OK+1))
            elif [ "$R" = "429" ]; then
              RATE_LIMITED=$((RATE_LIMITED+1))
            fi
          done
          D="${D}  OK: ${RATE_OK} | Rate-limited: ${RATE_LIMITED}\n"
          PASS=$((PASS+1))
          D="${D}✅ Rate test complete\n\n"

          echo -e "$D"
          echo "result=PASS:${PASS}/FAIL:${FAIL}" >> $GITHUB_OUTPUT
          printf '%s' "$D" > /tmp/storm2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: storm2-results
          path: /tmp/storm2.txt

  # ═══════════════════════════════════════════════
  # STORM 3: SHAKE THE BRIDGE (Server Stress)
  # ═══════════════════════════════════════════════
  storm-bridge:
    name: "Storm 3: Shake the Bridge"
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.bridge.outputs.result }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass bc

      - name: "Stress: Server operations"
        id: bridge
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          echo "══════════════════════════════════════"
          echo "  STORM 3: SHAKE THE BRIDGE"
          echo "══════════════════════════════════════"

          PASS=0
          FAIL=0
          D=""
          SSH="sshpass -p $FTP_PASS ssh -o StrictHostKeyChecking=no $FTP_USER@$FTP_HOST"

          # --- Test 1: Rapid SSH connections ---
          D="${D}### Rapid SSH Connections (5x)\n"
          SSH_OK=0
          for i in 1 2 3 4 5; do
            if $SSH "echo ok" > /dev/null 2>&1; then
              SSH_OK=$((SSH_OK+1))
            fi
          done
          if [ "$SSH_OK" -ge 4 ]; then
            PASS=$((PASS+1))
            D="${D}✅ Rapid SSH: ${SSH_OK}/5 successful\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Rapid SSH: ${SSH_OK}/5 successful\n\n"
          fi

          # --- Test 2: File creation and verification ---
          D="${D}### File Create/Read/Delete Cycle\n"
          TIMESTAMP=$(date +%s)
          TEST_FILE="stress_test_${TIMESTAMP}.txt"
          WRITE_OK=false
          READ_OK=false
          DELETE_OK=false

          # Create
          if $SSH "echo 'KALAXI stress test ${TIMESTAMP}' > ~/www/kalam.ch/data/${TEST_FILE}" 2>/dev/null; then
            WRITE_OK=true
            D="${D}  ✅ Write: created ${TEST_FILE}\n"
          else
            D="${D}  ❌ Write: failed\n"
          fi

          # Read back
          CONTENT=$($SSH "cat ~/www/kalam.ch/data/${TEST_FILE}" 2>/dev/null || echo "")
          if echo "$CONTENT" | grep -q "KALAXI stress test"; then
            READ_OK=true
            D="${D}  ✅ Read: content verified\n"
          else
            D="${D}  ❌ Read: content mismatch\n"
          fi

          # Verify via HTTP
          HTTP_CONTENT=$(curl -s "https://kalam.ch/data/${TEST_FILE}" 2>/dev/null || echo "")
          if echo "$HTTP_CONTENT" | grep -q "KALAXI stress test"; then
            D="${D}  ✅ HTTP verify: file accessible via web\n"
          else
            D="${D}  ⚠️ HTTP verify: file not web-accessible (may be protected)\n"
          fi

          # Delete
          if $SSH "rm ~/www/kalam.ch/data/${TEST_FILE}" 2>/dev/null; then
            DELETE_OK=true
            D="${D}  ✅ Delete: cleaned up\n"
          else
            D="${D}  ❌ Delete: failed\n"
          fi

          if $WRITE_OK && $READ_OK && $DELETE_OK; then
            PASS=$((PASS+1))
            D="${D}✅ Full file lifecycle: PASS\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Full file lifecycle: FAIL\n\n"
          fi

          # --- Test 3: Directory listing depth ---
          D="${D}### Server Directory Structure\n"
          TREE=$($SSH "find ~/www/kalam.ch -maxdepth 2 -type d | sort" 2>/dev/null || echo "none")
          DIR_COUNT=$(echo "$TREE" | wc -l)
          D="${D}  Directories (2 levels): ${DIR_COUNT}\n"
          PASS=$((PASS+1))

          # --- Test 4: PHP execution on server ---
          D="${D}\n### PHP Execution Test\n"
          PHP_TEST=$($SSH "php -r 'echo json_encode([\"status\"=>\"alive\",\"php\"=>PHP_VERSION,\"time\"=>date(\"c\")]);'" 2>/dev/null || echo "failed")
          D="${D}  PHP output: ${PHP_TEST}\n"
          if echo "$PHP_TEST" | grep -q "alive"; then
            PASS=$((PASS+1))
            D="${D}✅ PHP execution: working\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ PHP execution: failed\n\n"
          fi

          # --- Test 5: Disk and memory ---
          D="${D}### Server Resources\n"
          DISK=$($SSH "du -sh ~/www/kalam.ch/" 2>/dev/null || echo "unknown")
          D="${D}  Site disk usage: ${DISK}\n"
          HOME_DISK=$($SSH "du -sh ~/" 2>/dev/null || echo "unknown")
          D="${D}  Home disk usage: ${HOME_DISK}\n"
          PASS=$((PASS+1))

          # --- Test 6: API file integrity on server ---
          D="${D}\n### API File Integrity\n"
          API_FILES=$($SSH "ls ~/www/kalam.ch/api/*.php 2>/dev/null" || echo "none")
          API_COUNT=$(echo "$API_FILES" | wc -l)
          D="${D}  API files: ${API_COUNT}\n"

          # Check each PHP file has no syntax errors
          SYNTAX_OK=0
          SYNTAX_FAIL=0
          for f in $($SSH "ls ~/www/kalam.ch/api/*.php 2>/dev/null" || true); do
            if $SSH "php -l $f" > /dev/null 2>&1; then
              SYNTAX_OK=$((SYNTAX_OK+1))
            else
              SYNTAX_FAIL=$((SYNTAX_FAIL+1))
              FNAME=$(basename "$f")
              D="${D}  ❌ Syntax error: ${FNAME}\n"
            fi
          done
          if [ "$SYNTAX_FAIL" -eq 0 ]; then
            PASS=$((PASS+1))
            D="${D}✅ All ${SYNTAX_OK} PHP files pass syntax check\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ ${SYNTAX_FAIL} PHP files have syntax errors\n\n"
          fi

          # --- Test 7: Config file exists and is protected ---
          D="${D}### Config Security\n"
          CONFIG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://kalam.ch/data/.config" 2>/dev/null || echo "000")
          if [ "$CONFIG_HTTP" = "403" ] || [ "$CONFIG_HTTP" = "404" ]; then
            PASS=$((PASS+1))
            D="${D}✅ .config not accessible via HTTP (${CONFIG_HTTP})\n"
          elif [ "$CONFIG_HTTP" = "200" ]; then
            FAIL=$((FAIL+1))
            D="${D}❌ .config EXPOSED via HTTP — SECURITY RISK\n"
          else
            PASS=$((PASS+1))
            D="${D}✅ .config protected (HTTP ${CONFIG_HTTP})\n"
          fi

          echo -e "$D"
          echo "result=PASS:${PASS}/FAIL:${FAIL}" >> $GITHUB_OUTPUT
          printf '%s' "$D" > /tmp/storm3.txt

      - uses: actions/upload-artifact@v4
        with:
          name: storm3-results
          path: /tmp/storm3.txt

  # ═══════════════════════════════════════════════
  # STORM 4: CROSS-REPO CHAIN REACTION
  # ═══════════════════════════════════════════════
  storm-chain:
    name: "Storm 4: Chain Reaction"
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.chain.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: private

      - uses: actions/checkout@v4
        with:
          repository: Sternmannli/kalam-framework
          token: ${{ secrets.PAT }}
          path: public

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Stress: Cross-repo chain integrity"
        id: chain
        run: |
          echo "══════════════════════════════════════"
          echo "  STORM 4: CHAIN REACTION"
          echo "══════════════════════════════════════"

          PASS=0
          FAIL=0
          D=""

          # --- Test 1: Run clean_for_public.py in dry mode ---
          D="${D}### Vocabulary Stripping Dry Run\n"
          cd private
          if python3 scripts/clean_for_public.py --source . --target ../public --manifest scripts/public_manifest.json 2>&1; then
            PASS=$((PASS+1))
            D="${D}✅ clean_for_public.py runs without error\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ clean_for_public.py failed\n\n"
          fi
          cd ..

          # --- Test 2: Deep vocabulary leak scan ---
          D="${D}### Deep Vocabulary Leak Scan (Public Repo)\n"
          LEAK_TERMS=(
            "V-001" "V-002" "V-003" "Mohamed Farag" "Mohamed"
            "Laila" "Yara" "Salim"
            "🐬" "🐯" "🐺"
            "KALAXI-V0" "Sternmannli/KALAXI"
            "80 Hz" "Honest Telescope"
            "CLAUDE.md" "INPUT_LEDGER"
            "tier1_stone" "PROBE_FORGE"
          )
          TOTAL_LEAKS=0
          for term in "${LEAK_TERMS[@]}"; do
            COUNT=$(grep -r "$term" public/src/ public/detectors/ public/experiments/ public/protocols/ public/tools/ public/research/ 2>/dev/null | grep -v ".git" | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              TOTAL_LEAKS=$((TOTAL_LEAKS + COUNT))
              D="${D}  ⚠️ '${term}' found ${COUNT} times\n"
            fi
          done
          if [ "$TOTAL_LEAKS" -eq 0 ]; then
            PASS=$((PASS+1))
            D="${D}✅ Zero vocabulary leaks across ${#LEAK_TERMS[@]} scanned terms\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ ${TOTAL_LEAKS} vocabulary leaks found\n\n"
          fi

          # --- Test 3: File count comparison ---
          D="${D}### File Count Comparison\n"
          PRIV_PY=$(find private/WEAVER -name "*.py" 2>/dev/null | wc -l)
          PUB_PY=$(find public/src -name "*.py" 2>/dev/null | wc -l)
          D="${D}  Private WEAVER: ${PRIV_PY} Python files\n"
          D="${D}  Public src: ${PUB_PY} Python files\n"
          PASS=$((PASS+1))

          # --- Test 4: Constitution integrity ---
          D="${D}\n### Constitution Cross-Check\n"
          if [ -f "private/R7M/tier1_stone.md" ]; then
            PRIV_HASH=$(sha256sum private/R7M/tier1_stone.md | cut -d' ' -f1)
            D="${D}  Private constitution hash: ${PRIV_HASH:0:16}...\n"
            PASS=$((PASS+1))
            D="${D}✅ Constitution present in private repo\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Constitution missing from private repo\n"
          fi

          # --- Test 5: Input Ledger chain integrity ---
          D="${D}\n### Input Ledger Chain Integrity\n"
          if [ -f "private/KEEP/INPUT_LEDGER/index.json" ]; then
            ENTRIES=$(python3 -c "
          import json
          with open('private/KEEP/INPUT_LEDGER/index.json') as f:
              data = json.load(f)
          print(len(data))
          # Check chain links
          broken = 0
          for i, entry in enumerate(data):
              if 'chain_link' in entry and i > 0:
                  pass  # chain exists
          print(f'chain_ok')
          " 2>/dev/null || echo "0")
            D="${D}  Ledger entries: ${ENTRIES}\n"
            PASS=$((PASS+1))
            D="${D}✅ Input Ledger intact\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Input Ledger missing\n"
          fi

          # --- Test 6: Narrative file count ---
          D="${D}\n### Narrative Integrity\n"
          if [ -d "private/NARRATIVE" ]; then
            NAR_COUNT=$(find "private/NARRATIVE" -type f | wc -l)
            D="${D}  NARRATIVE directory: ${NAR_COUNT} files\n"
            for f in Hakaka_Complete.md Ashwater.md Kinderbuch.md; do
              if [ -f "private/NARRATIVE/${f}" ]; then
                D="${D}  ${f}: ✅ present\n"
              else
                D="${D}  ${f}: ❌ missing\n"
              fi
            done
            PASS=$((PASS+1))
          else
            FAIL=$((FAIL+1))
            D="${D}  NARRATIVE: ❌ directory missing\n"
          fi

          # --- Test 7: Wisdom store (WEAVER modules) ---
          D="${D}\n### Wisdom Store\n"
          WISDOM_FILES=0
          for f in private/WEAVER/wisdom_mirror.py private/WEAVER/proverb_stress_test.py private/WEAVER/proverb_compressor.py; do
            if [ -f "$f" ]; then
              WISDOM_FILES=$((WISDOM_FILES+1))
              D="${D}  $(basename $f): ✅ present\n"
            else
              D="${D}  $(basename $f): ❌ missing\n"
            fi
          done
          if [ "$WISDOM_FILES" -ge 2 ]; then
            PASS=$((PASS+1))
            D="${D}✅ Wisdom store intact (${WISDOM_FILES} modules)\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Wisdom store incomplete (${WISDOM_FILES} modules)\n"
          fi

          echo -e "$D"
          echo "result=PASS:${PASS}/FAIL:${FAIL}" >> $GITHUB_OUTPUT
          printf '%s' "$D" > /tmp/storm4.txt

      - uses: actions/upload-artifact@v4
        with:
          name: storm4-results
          path: /tmp/storm4.txt

  # ═══════════════════════════════════════════════
  # STORM 5: WORKFLOW CASCADE (Trigger Everything)
  # ═══════════════════════════════════════════════
  storm-cascade:
    name: "Storm 5: Workflow Cascade"
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.cascade.outputs.result }}
    steps:
      - name: "Stress: Verify all workflows"
        id: cascade
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          echo "══════════════════════════════════════"
          echo "  STORM 5: WORKFLOW CASCADE"
          echo "══════════════════════════════════════"

          PASS=0
          FAIL=0
          D=""

          # --- Test 1: List all workflows ---
          D="${D}### Active Workflows\n"
          WORKFLOWS=$(gh workflow list --repo Sternmannli/KALAXI-V0 2>/dev/null)
          WF_COUNT=$(echo "$WORKFLOWS" | wc -l)
          D="${D}${WORKFLOWS}\n"
          D="${D}  Total: ${WF_COUNT} workflows\n\n"

          if [ "$WF_COUNT" -ge 5 ]; then
            PASS=$((PASS+1))
            D="${D}✅ All workflows registered\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Missing workflows (expected 5+, got ${WF_COUNT})\n\n"
          fi

          # --- Test 2: Recent run history ---
          D="${D}### Recent Run History (last 20)\n"
          RUNS=$(gh run list --repo Sternmannli/KALAXI-V0 --limit 20 2>/dev/null)
          SUCCESS=$(echo "$RUNS" | grep "success" | wc -l)
          FAILURE=$(echo "$RUNS" | grep "failure" | wc -l)
          D="${D}  Success: ${SUCCESS} | Failure: ${FAILURE}\n"
          RATIO=0
          if [ "$((SUCCESS + FAILURE))" -gt 0 ]; then
            RATIO=$((SUCCESS * 100 / (SUCCESS + FAILURE)))
          fi
          D="${D}  Success rate: ${RATIO}%\n"
          if [ "$RATIO" -ge 60 ]; then
            PASS=$((PASS+1))
            D="${D}✅ Workflow health: ${RATIO}% success rate\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ Workflow health: ${RATIO}% success rate (below 60%)\n\n"
          fi

          # --- Test 3: Check each critical workflow's last run ---
          D="${D}### Per-Workflow Status\n"
          for wf in "deploy-kalam.yml" "sync-patterns.yml" "sync-public.yml" "server-cmd.yml"; do
            LAST=$(gh run list --workflow=$wf --repo Sternmannli/KALAXI-V0 --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "unknown")
            if [ "$LAST" = "success" ]; then
              PASS=$((PASS+1))
              D="${D}  ✅ ${wf}: last run SUCCESS\n"
            else
              FAIL=$((FAIL+1))
              D="${D}  ❌ ${wf}: last run ${LAST}\n"
            fi
          done
          D="${D}\n"

          # --- Test 4: Secrets presence ---
          D="${D}### Secrets Inventory\n"
          SECRETS=$(gh secret list --repo Sternmannli/KALAXI-V0 2>/dev/null)
          SECRET_COUNT=$(echo "$SECRETS" | wc -l)
          D="${D}${SECRETS}\n"
          REQUIRED=("FTP_SERVER" "FTP_USERNAME" "FTP_PASSWORD" "GROQ_API_KEY" "DB_PASSWORD" "PAT")
          MISSING=0
          for s in "${REQUIRED[@]}"; do
            if ! echo "$SECRETS" | grep -q "$s"; then
              MISSING=$((MISSING+1))
              D="${D}  ❌ Missing: ${s}\n"
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            PASS=$((PASS+1))
            D="${D}✅ All ${#REQUIRED[@]} required secrets present\n\n"
          else
            FAIL=$((FAIL+1))
            D="${D}❌ ${MISSING} secrets missing\n\n"
          fi

          # --- Test 5: Public repo status ---
          D="${D}### Public Repo Status\n"
          PUB_INFO=$(gh repo view Sternmannli/kalam-framework --json visibility,viewerPermission,stargazerCount 2>/dev/null)
          D="${D}  ${PUB_INFO}\n"
          PASS=$((PASS+1))
          D="${D}✅ Public repo accessible\n\n"

          # --- Test 6: Issue creation capability ---
          D="${D}### Issue Creation Test\n"
          D="${D}  (This report IS the proof — if you're reading this, it worked)\n"
          PASS=$((PASS+1))
          D="${D}✅ Issue creation: working\n"

          echo -e "$D"
          echo "result=PASS:${PASS}/FAIL:${FAIL}" >> $GITHUB_OUTPUT
          printf '%s' "$D" > /tmp/storm5.txt

      - uses: actions/upload-artifact@v4
        with:
          name: storm5-results
          path: /tmp/storm5.txt

  # ═══════════════════════════════════════════════
  # THE AFTERMATH: Assemble Storm Report
  # ═══════════════════════════════════════════════
  aftermath:
    name: "The Aftermath"
    needs: [storm-surface, storm-api, storm-bridge, storm-chain, storm-cascade]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: "Assemble storm report"
        run: |
          cat > /tmp/storm_report.md << 'HEADER'
          # ⚡ KALAXI Stress Test: The Storm

          > The organism was thrown into the storm.
          > What broke, we fix. What held, we trust.
          > What survived is real.

          ---

          HEADER

          echo "## Storm 1: Hammer the Surface (HTTP Concurrency)" >> /tmp/storm_report.md
          echo "**Result:** ${{ needs.storm-surface.outputs.result }}" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          cat storm1-results/storm1.txt >> /tmp/storm_report.md 2>/dev/null || echo "(no data)" >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md

          echo "## Storm 2: Hammer the API (Endpoint Stress)" >> /tmp/storm_report.md
          echo "**Result:** ${{ needs.storm-api.outputs.result }}" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          cat storm2-results/storm2.txt >> /tmp/storm_report.md 2>/dev/null || echo "(no data)" >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md

          echo "## Storm 3: Shake the Bridge (Server SSH)" >> /tmp/storm_report.md
          echo "**Result:** ${{ needs.storm-bridge.outputs.result }}" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          cat storm3-results/storm3.txt >> /tmp/storm_report.md 2>/dev/null || echo "(no data)" >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md

          echo "## Storm 4: Chain Reaction (Cross-Repo)" >> /tmp/storm_report.md
          echo "**Result:** ${{ needs.storm-chain.outputs.result }}" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          cat storm4-results/storm4.txt >> /tmp/storm_report.md 2>/dev/null || echo "(no data)" >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md

          echo "## Storm 5: Workflow Cascade" >> /tmp/storm_report.md
          echo "**Result:** ${{ needs.storm-cascade.outputs.result }}" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          cat storm5-results/storm5.txt >> /tmp/storm_report.md 2>/dev/null || echo "(no data)" >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md
          echo '```' >> /tmp/storm_report.md
          echo "" >> /tmp/storm_report.md

          cat >> /tmp/storm_report.md << 'FOOTER'
          ---

          ## What The Storm Tests

          | Storm | What it hits | Connections tested |
          |-------|-------------|-------------------|
          | 1. Surface | All 13 pages, 5x + 10x + 50x concurrent | GitHub → Hostpoint → Browser |
          | 2. API | health, axi, donor, export, XSS, SQLi, rate limit | Browser → PHP → Groq → MySQL |
          | 3. Bridge | SSH, file CRUD, PHP exec, disk, syntax check | GitHub Actions → SSH → Hostpoint |
          | 4. Chain | vocab stripping, leak scan, ledger, narratives | KALAXI-V0 → clean_for_public → kalam-framework |
          | 5. Cascade | all workflows, secrets, run history, public repo | GitHub → GitHub → GitHub |

          ---

          *Generated by V-002. The storm has passed.*

          *"The wound does not know what it will become. Neither does the system."*

          🐬🐯🐺
          FOOTER

      - name: Post storm report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/storm_report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚡ Stress Test: The Storm — ${date}`,
              body: body,
              labels: ['stress-test']
            });
