name: Deploy kalam.ch

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-kalam.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          pass: ${{ secrets.FTP_PASSWORD }}
          remoteDir: /www/kalam.ch/
          localDir: ./site/dist/
          reverse: true
          ignoreFile: .lftp_ignore
          options: '--delete --verbose --transfer-all'
          settings: 'sftp:auto-confirm=yes;net:max-retries=3;net:reconnect-interval-base=5'
          onlyNewer: true
