name: Deploy kalam.ch

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-kalam.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp sshpass

      - name: Create API config
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > site/dist/data/.config

      - name: Deploy via lftp
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" sftp://$FTP_HOST -e "
            set sftp:auto-confirm yes;
            cd /www/kalam.ch;
            put site/dist/index.html;
            put site/dist/404.html;
            put site/dist/favicon.svg;
            put site/dist/robots.txt;
            put site/dist/sitemap-0.xml;
            put site/dist/sitemap-index.xml;
            mkdir -p about;
            put site/dist/about/index.html -o about/index.html;
            mkdir -p canon;
            put site/dist/canon/index.html -o canon/index.html;
            mkdir -p invitation;
            put site/dist/invitation/index.html -o invitation/index.html;
            mkdir -p _astro;
            mirror -R --delete site/dist/_astro/ _astro/;
            mkdir -p api;
            put site/dist/api/threshold.php -o api/threshold.php;
            put site/dist/api/.htaccess -o api/.htaccess;
            mkdir -p data;
            put site/dist/data/.htaccess -o data/.htaccess;
            put site/dist/data/.config -o data/.config;
            put site/dist/data/.config.example -o data/.config.example;
            bye;
          "
