name: Deploy kalam.ch

on:
  schedule:
    - cron: '0 4 * * *'   # Daily at 04:00 UTC
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies and build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Create API config
        run: |
          mkdir -p site/dist/data
          cat > site/dist/data/.config << CONF
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          DB_HOST=faragmoh.mysql.db.internal
          DB_NAME=faragmoh_ty30
          DB_USER=faragmoh_ty30
          DB_PASS=${{ secrets.DB_PASSWORD }}
          EXPORT_KEY=${{ secrets.EXPORT_KEY }}
          CONF

      - name: Deploy via lftp mirror
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          echo "--- Deploying site/dist/ to www/kalam.ch/ ---"
          ls -la site/dist/
          ls -la site/dist/api/ || echo "No api/ dir"
          ls -la site/dist/data/ || echo "No data/ dir"
          echo "---"
          lftp -u "${FTP_USER},${FTP_PASS}" "sftp://${FTP_HOST}" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            cd www/kalam.ch || exit 1;
            mkdir -p data;
            rm -f data/kalam.db;
            mirror --reverse --verbose --include-glob=*.html --include-glob=*.svg --include-glob=*.xml --include-glob=*.css --include-glob=*.js --include-glob=*.php --include-glob=*.json --include-glob=*.png --include-glob=*.md --include-glob=.htaccess --include-glob=.config --include-glob=*.txt site/dist/ .;
            bye;
          "
          echo "--- Deploy complete ---"

      - name: Health check — verify site is alive
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kalam.ch/ || echo "000")
          echo "Health check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Site health check failed with HTTP $STATUS"
          fi

      - name: Content verification — compare deployed vs built
        run: |
          BUILT_HASH=$(sha256sum site/dist/index.html | cut -d' ' -f1)
          echo "Built hash: $BUILT_HASH"
          LIVE_CONTENT=$(curl -s https://kalam.ch/ || echo "")
          if [ -n "$LIVE_CONTENT" ]; then
            LIVE_HASH=$(echo "$LIVE_CONTENT" | sha256sum | cut -d' ' -f1)
            echo "Live hash:  $LIVE_HASH"
            if [ "$BUILT_HASH" = "$LIVE_HASH" ]; then
              echo "Content verified: deployed matches built."
            else
              echo "::warning::Content mismatch — deployed HTML differs from built HTML"
            fi
          else
            echo "::warning::Could not fetch live site for verification"
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed: ${context.sha.substring(0, 7)}`,
              body: `Deployment to kalam.ch failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}\nTime: ${new Date().toISOString()}`,
              labels: ['deploy-failure']
            })
