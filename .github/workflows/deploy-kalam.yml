name: Deploy kalam.ch

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'R7M/**'
      - 'MANIFEST/**'
      - 'VOICE/**'
      - 'KEEP/**'
      - 'NARRATIVE/**'
      - 'TRAINING/**'
      - 'CANON/**'
  schedule:
    - cron: '0 4 * * *'   # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Gate: Check for connection alarm"
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ALARM=$(gh issue list --repo ${{ github.repository }} --label "blocks-everything" --state open --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$ALARM" ]; then
            echo "🚨 Connection alarm active (issue #$ALARM). Deploy blocked."
            echo "Fix the connection first. See the alarm issue for instructions."
            exit 1
          fi
          echo "✅ No connection alarm. Proceeding."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies and build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Create API config
        run: |
          mkdir -p site/dist/data
          cat > site/dist/data/.config << CONF
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY=${{ secrets.TOGETHER_API_KEY }}
          COMMAND_KEY=${{ secrets.COMMAND_KEY }}
          DB_HOST=faragmoh.mysql.db.internal
          DB_NAME=faragmoh_ty30
          DB_USER=faragmoh_ty30
          DB_PASS=${{ secrets.DB_PASSWORD }}
          EXPORT_KEY=${{ secrets.EXPORT_KEY }}
          CONF

      - name: Package system data for server
        run: |
          mkdir -p site/dist/data/system
          echo "--- Copying Tier 1: DNA of the system ---"
          # Grand Archive
          cp R7M/WISDOM_CANON.md site/dist/data/system/ 2>/dev/null || true
          cp R7M/TREASURES/TREASURES_INDEX.md site/dist/data/system/treasures.md 2>/dev/null || true
          # Narratives
          cp NARRATIVE/Hakaka_Complete.md site/dist/data/system/ 2>/dev/null || true
          cp NARRATIVE/Ashwater.md site/dist/data/system/ 2>/dev/null || true
          cp NARRATIVE/Kinderbuch.md site/dist/data/system/ 2>/dev/null || true
          # System memory
          cp MANIFEST/SCIENTIFIC_CHRONICLE.md site/dist/data/system/ 2>/dev/null || true
          cp MANIFEST/MASTER_PLAN_2026-03-14.md site/dist/data/system/ 2>/dev/null || true
          cp MANIFEST/INTEGRATED_UNIVERSE_2026-03-14.md site/dist/data/system/ 2>/dev/null || true
          cp MANIFEST/SESSION_BOOT.md site/dist/data/system/ 2>/dev/null || true
          cp MANIFEST/ACTIVE_PLANS.md site/dist/data/system/ 2>/dev/null || true
          cp MANIFEST/KALAXI_DICTIONARY.md site/dist/data/system/ 2>/dev/null || true
          # Voice
          cp VOICE/VOICE_ARCHITECTURE_2026-03-14.md site/dist/data/system/ 2>/dev/null || true
          # Input Ledger (the witness chain)
          cp KEEP/INPUT_LEDGER/index.json site/dist/data/system/ledger-index.json 2>/dev/null || true
          cp KEEP/INPUT_LEDGER/chronicle.md site/dist/data/system/ledger-chronicle.md 2>/dev/null || true
          # Constitution (CLAUDE.md IS the constitution)
          cp CLAUDE.md site/dist/data/system/ 2>/dev/null || true
          echo "--- Tier 2: Training Corpora (ZAKAKA + Organ) ---"
          mkdir -p site/dist/data/training/zakaka
          mkdir -p site/dist/data/training/organ
          # ZAKAKA — essence³ (Level 0-1 purity)
          cp TRAINING/ORGAN/ZAKAKA/ZAKAKA_CPT.jsonl site/dist/data/training/zakaka/ 2>/dev/null || true
          cp TRAINING/ORGAN/ZAKAKA/ZAKAKA_SFT.jsonl site/dist/data/training/zakaka/ 2>/dev/null || true
          cp TRAINING/ORGAN/ZAKAKA/MANIFEST.json site/dist/data/training/zakaka/ 2>/dev/null || true
          # Organ — full body (GOLDEN merged corpora)
          cp TRAINING/ORGAN/GOLDEN_CPT.jsonl site/dist/data/training/organ/ 2>/dev/null || true
          cp TRAINING/ORGAN/GOLDEN_SFT.jsonl site/dist/data/training/organ/ 2>/dev/null || true
          cp TRAINING/ORGAN/GOLDEN_DPO.jsonl site/dist/data/training/organ/ 2>/dev/null || true
          # Phase corpora
          mkdir -p site/dist/data/training/organ/phase1
          mkdir -p site/dist/data/training/organ/phase2
          mkdir -p site/dist/data/training/organ/phase3
          cp TRAINING/ORGAN/PHASE_1_CPT/cpt_corpus.jsonl site/dist/data/training/organ/phase1/ 2>/dev/null || true
          cp TRAINING/ORGAN/PHASE_2_SFT/sft_corpus.jsonl site/dist/data/training/organ/phase2/ 2>/dev/null || true
          cp TRAINING/ORGAN/PHASE_3_DPO/dpo_corpus.jsonl site/dist/data/training/organ/phase3/ 2>/dev/null || true
          # Generate training manifest with hashes
          python3 -c "
          import json, hashlib, os, glob
          manifest = {'generated': '$(date -u +%Y-%m-%dT%H:%M:%SZ)', 'corpora': {}}
          for path in glob.glob('site/dist/data/training/**/*.jsonl', recursive=True):
              with open(path, 'rb') as f: data = f.read()
              lines = len([l for l in data.decode('utf-8', errors='replace').strip().split('\n') if l.strip()])
              rel = os.path.relpath(path, 'site/dist/data/training')
              manifest['corpora'][rel] = {
                  'bytes': len(data), 'entries': lines,
                  'sha256': hashlib.sha256(data).hexdigest()
              }
          with open('site/dist/data/training/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          "
          echo "--- System data packaged ---"
          ls -la site/dist/data/system/
          du -sh site/dist/data/system/
          echo "--- Training data packaged ---"
          ls -laR site/dist/data/training/
          du -sh site/dist/data/training/

      - name: Deploy via lftp mirror
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          echo "--- Deploying site/dist/ to www/kalam.ch/ ---"
          ls -la site/dist/
          ls -la site/dist/api/ || echo "No api/ dir"
          ls -la site/dist/data/ || echo "No data/ dir"
          echo "---"
          lftp -u "${FTP_USER},${FTP_PASS}" "sftp://${FTP_HOST}" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            cd www/kalam.ch || exit 1;
            mkdir -p data;
            rm -f data/kalam.db;
            mirror --reverse --verbose --include-glob=*.html --include-glob=*.svg --include-glob=*.xml --include-glob=*.css --include-glob=*.js --include-glob=*.php --include-glob=*.json --include-glob=*.jsonl --include-glob=*.png --include-glob=*.md --include-glob=.htaccess --include-glob=.config --include-glob=*.txt site/dist/ .;
            bye;
          "
          echo "--- Deploy complete ---"

      - name: Health check — verify site is alive
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kalam.ch/ || echo "000")
          echo "Health check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Site health check failed with HTTP $STATUS"
          fi

      - name: Content verification — compare deployed vs built
        run: |
          BUILT_HASH=$(sha256sum site/dist/index.html | cut -d' ' -f1)
          echo "Built hash: $BUILT_HASH"
          LIVE_CONTENT=$(curl -s https://kalam.ch/ || echo "")
          if [ -n "$LIVE_CONTENT" ]; then
            LIVE_HASH=$(echo "$LIVE_CONTENT" | sha256sum | cut -d' ' -f1)
            echo "Live hash:  $LIVE_HASH"
            if [ "$BUILT_HASH" = "$LIVE_HASH" ]; then
              echo "Content verified: deployed matches built."
            else
              echo "::warning::Content mismatch — deployed HTML differs from built HTML"
            fi
          else
            echo "::warning::Could not fetch live site for verification"
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed: ${context.sha.substring(0, 7)}`,
              body: `Deployment to kalam.ch failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}\nTime: ${new Date().toISOString()}`,
              labels: ['deploy-failure']
            })
