name: Deploy kalam.ch

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-kalam.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Create API config
        run: |
          mkdir -p site/dist/data
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > site/dist/data/.config

      - name: Deploy via lftp mirror
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          echo "--- Deploying site/dist/ to www/kalam.ch/ ---"
          ls -la site/dist/
          ls -la site/dist/api/ || echo "No api/ dir"
          ls -la site/dist/data/ || echo "No data/ dir"
          ls -la site/dist/_astro/ || echo "No _astro/ dir"
          echo "---"
          lftp -u "${FTP_USER},${FTP_PASS}" "sftp://${FTP_HOST}" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            cd www/kalam.ch || exit 1;
            mirror --reverse --verbose --include-glob=*.html --include-glob=*.svg --include-glob=*.xml --include-glob=*.css --include-glob=*.php --include-glob=.htaccess --include-glob=.config --include-glob=.config.example --include-glob=*.txt site/dist/ .;
            bye;
          "
          echo "--- Deploy complete ---"
