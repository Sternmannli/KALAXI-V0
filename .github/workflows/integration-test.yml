          echo "**Pages:** ${{ needs.build.outputs.page_count }} | **Size:** ${{ needs.build.outputs.build_size }}" >> /tmp/report_body.md
          echo '```' >> /tmp/report_body.md
          echo -e "$PHASE2" >> /tmp/report_body.md
          echo '```' >> /tmp/report_body.md
          echo "" >> /tmp/report_body.md

          echo "## Phase 3: The Surface (Live Site)" >> /tmp/report_body.md
          echo "**Result:** $F3" >> /tmp/report_body.md
          echo '```' >> /tmp/report_body.md
          echo -e "$PHASE3" >> /tmp/report_body.md
          echo '```' >> /tmp/report_body.md
          echo "" >> /tmp/report_body.md

          echo "## Phase 4: The Bridge (Server SSH)" >> /tmp/report_body.md
          echo "**Result:** $F4" >> /tmp/report_body.md
          echo '```' >> /tmp/report_body.md
          echo -e "$PHASE4" >> /tmp/report_body.md
