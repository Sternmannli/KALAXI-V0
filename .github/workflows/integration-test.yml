          echo "---" >> /tmp/report_body.md
          echo "" >> /tmp/report_body.md
          echo "## System Vitals" >> /tmp/report_body.md
          echo "| Metric | Value |" >> /tmp/report_body.md
          echo "|--------|-------|" >> /tmp/report_body.md
          echo "| Python files | ${{ needs.foundation.outputs.python_files }} |" >> /tmp/report_body.md
          echo "| Total lines | ${{ needs.foundation.outputs.total_lines }} |" >> /tmp/report_body.md
          echo "| Test files | ${{ needs.foundation.outputs.test_count }} |" >> /tmp/report_body.md
          echo "| Built pages | ${{ needs.build.outputs.page_count }} |" >> /tmp/report_body.md
          echo "| Build size | ${{ needs.build.outputs.build_size }} |" >> /tmp/report_body.md
          echo "" >> /tmp/report_body.md
          echo "---" >> /tmp/report_body.md
          echo "*Generated $(date -u +%Y-%m-%dT%H:%M:%SZ) by V-002*" >> /tmp/report_body.md
          echo "" >> /tmp/report_body.md
          echo "*Three threads cross the river. The knot holds.*" >> /tmp/report_body.md
          echo "🐬🐯🐺" >> /tmp/report_body.md

      - name: Post report as GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report_body.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Integration Test: The Full Breath — ${date}`,
              body: body,
              labels: ['integration-test']
            });
