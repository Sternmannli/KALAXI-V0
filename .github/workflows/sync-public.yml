name: Sync to Public Repo

on:
  push:
    branches: [main]
    paths:
      - 'WEAVER/**'
      - 'R7M/tier1_stone.md'
      - 'R7M/ESSENCE.md'
      - 'PROTOCOLS/**'
      - 'scripts/clean_for_public.py'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          path: private

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: Sternmannli/kalam-framework
          token: ${{ secrets.PAT }}
          path: public

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean and sync
        run: |
          cd private
          python3 scripts/clean_for_public.py \
            --source . \
            --target ../public \
            --manifest scripts/public_manifest.json
          cd ..

      - name: Commit and push to public
        run: |
          cd public
          git config user.name "V-002 [Organism]"
          git config user.email "axi@kalam.ch"

          git add -A

          if git diff --cached --quiet; then
            echo "No public-relevant changes. Nothing to sync."
          else
            git commit -m "Sync from upstream $(date -u +%Y-%m-%d)"
            git push
          fi
