name: Fine-tune AXI Voice (Together AI)

on:
  push:
    branches: [main]
    paths:
      - 'TRAINING/FINETUNE_TRIGGER.json'
  workflow_dispatch:
    inputs:
      model_base:
        description: 'Base model for fine-tuning'
        required: true
        default: 'meta-llama/Meta-Llama-3.1-8B-Instruct'
        type: choice
        options:
          - meta-llama/Meta-Llama-3.1-8B-Instruct
          - meta-llama/Llama-3.3-70B-Instruct-Turbo
          - mistralai/Mistral-7B-Instruct-v0.3
      epochs:
        description: 'Number of training epochs'
        required: true
        default: '3'
        type: string
      suffix:
        description: 'Model suffix (e.g. axi-v1)'
        required: true
        default: 'axi-voice-v1'
        type: string
      dry_run:
        description: 'Dry run (upload only, no training)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  finetune:
    runs-on: ubuntu-latest
    env:
      MODEL_BASE: ${{ inputs.model_base || 'meta-llama/Meta-Llama-3.1-8B-Instruct' }}
      EPOCHS: ${{ inputs.epochs || '3' }}
      SUFFIX: ${{ inputs.suffix || 'axi-voice-v1' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read trigger file config
        if: github.event_name == 'push'
        run: |
          if [ -f TRAINING/FINETUNE_TRIGGER.json ]; then
            echo "Trigger file found — reading config"
            DRY=$(python3 -c "import json; print(json.load(open('TRAINING/FINETUNE_TRIGGER.json')).get('dry_run','true'))" 2>/dev/null || echo "true")
            MODEL=$(python3 -c "import json; print(json.load(open('TRAINING/FINETUNE_TRIGGER.json')).get('model','meta-llama/Meta-Llama-3.1-8B-Instruct'))" 2>/dev/null || echo "meta-llama/Meta-Llama-3.1-8B-Instruct")
            EP=$(python3 -c "import json; print(json.load(open('TRAINING/FINETUNE_TRIGGER.json')).get('epochs','3'))" 2>/dev/null || echo "3")
            SUF=$(python3 -c "import json; print(json.load(open('TRAINING/FINETUNE_TRIGGER.json')).get('suffix','axi-voice-v1'))" 2>/dev/null || echo "axi-voice-v1")
            echo "DRY_RUN=$DRY" >> $GITHUB_ENV
            echo "MODEL_BASE=$MODEL" >> $GITHUB_ENV
            echo "EPOCHS=$EP" >> $GITHUB_ENV
            echo "SUFFIX=$SUF" >> $GITHUB_ENV
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Together SDK
        run: pip install together

      - name: Validate corpus
        run: |
          python3 -c "
          import json, sys
          path = 'TRAINING/CORPUS_COMPILED.jsonl'
          with open(path) as f:
              lines = f.readlines()
          bad = 0
          for i, line in enumerate(lines):
              try:
                  obj = json.loads(line)
                  assert 'messages' in obj, f'Line {i+1}: missing messages'
                  assert any(m['role'] == 'assistant' for m in obj['messages']), f'Line {i+1}: no assistant'
              except Exception as e:
                  bad += 1
                  print(f'ERROR line {i+1}: {e}')
          print(f'Total: {len(lines)} entries, {bad} invalid')
          if bad > 0:
              sys.exit(1)
          print('Corpus valid.')
          "

      - name: Verify API key present
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          if [ -z "$TOGETHER_API_KEY" ]; then
            echo "::error::TOGETHER_API_KEY secret is empty or not set"
            exit 1
          fi
          KEY_LEN=${#TOGETHER_API_KEY}
          echo "API key length: $KEY_LEN chars"
          echo "API key prefix: ${TOGETHER_API_KEY:0:8}..."
          if [ "$KEY_LEN" -lt 40 ]; then
            echo "::error::TOGETHER_API_KEY appears truncated ($KEY_LEN chars). Expected 64+."
            exit 1
          fi
          echo "Key looks valid (length OK)."

      - name: Prepare corpus (strip metadata for Together AI)
        run: |
          python3 -c "
          import json
          with open('TRAINING/CORPUS_COMPILED.jsonl') as f:
              lines = f.readlines()
          clean = 0
          with open('TRAINING/corpus_upload.jsonl', 'w') as out:
              for line in lines:
                  obj = json.loads(line)
                  out.write(json.dumps({'messages': obj['messages']}) + '\n')
                  clean += 1
          print(f'Prepared {clean} entries (metadata stripped)')
          "

      - name: Upload corpus to Together AI
        id: upload
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          python3 << 'PYEOF'
          from together import Together
          import os, sys, traceback

          try:
              key = os.environ.get('TOGETHER_API_KEY', '')
              print(f'Key length: {len(key)}, prefix: {key[:8]}...')

              client = Together()
              response = client.files.upload(
                  file='TRAINING/corpus_upload.jsonl',
                  purpose='fine-tune'
              )
              file_id = response.id
              print(f'File uploaded: {file_id}')
              print(f'Filename: {response.filename}')
              print(f'Bytes: {response.bytes}')

              with open('file_id.txt', 'w') as f:
                  f.write(file_id)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'file_id={file_id}\n')
                  f.write(f'file_bytes={response.bytes}\n')
          except Exception as e:
              print(f'UPLOAD FAILED: {type(e).__name__}: {e}')
              traceback.print_exc()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'upload_error={type(e).__name__}: {e}\n')
              sys.exit(1)
          PYEOF

      - name: Start fine-tuning job
        id: train
        if: env.DRY_RUN == 'false'
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FINETUNE_MODEL: ${{ env.MODEL_BASE }}
          FINETUNE_EPOCHS: ${{ env.EPOCHS }}
          FINETUNE_SUFFIX: ${{ env.SUFFIX }}
        run: |
          python3 << 'PYEOF'
          from together import Together
          import os, sys, traceback

          try:
              file_id = open('file_id.txt').read().strip()
              model = os.environ['FINETUNE_MODEL']
              epochs = int(os.environ['FINETUNE_EPOCHS'])
              suffix = os.environ['FINETUNE_SUFFIX']

              print(f'Starting fine-tune: file={file_id}, model={model}, epochs={epochs}, suffix={suffix}')

              client = Together()
              response = client.fine_tuning.create(
                  training_file=file_id,
                  model=model,
                  n_epochs=epochs,
                  suffix=suffix
              )
              print(f'Fine-tune job created: {response.id}')
              print(f'Model: {response.model}')
              print(f'Status: {response.status}')
              print(f'Output model will be: {response.output_name}')

              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'job_id={response.id}\n')
                  f.write(f'output_model={response.output_name}\n')
                  f.write(f'status={response.status}\n')
          except Exception as e:
              print(f'TRAINING FAILED: {type(e).__name__}: {e}')
              traceback.print_exc()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'train_error={type(e).__name__}: {e}\n')
              sys.exit(1)
          PYEOF

      - name: Post result as issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const dryRun = '${{ env.DRY_RUN }}';
            const fileId = '${{ steps.upload.outputs.file_id }}' || 'upload failed';
            const fileBytes = '${{ steps.upload.outputs.file_bytes }}' || '?';
            const uploadError = '${{ steps.upload.outputs.upload_error }}' || '';
            const jobId = '${{ steps.train.outputs.job_id }}' || 'N/A';
            const outputModel = '${{ steps.train.outputs.output_model }}' || 'N/A';
            const trainStatus = '${{ steps.train.outputs.status }}' || 'N/A';
            const trainError = '${{ steps.train.outputs.train_error }}' || '';

            let body = `## Fine-tune workflow result\n\n`;
            body += `**Status:** ${status}\n`;
            body += `**Dry run:** ${dryRun}\n`;
            body += `**Base model:** ${{ env.MODEL_BASE }}\n`;
            body += `**Epochs:** ${{ env.EPOCHS }}\n`;
            body += `**Suffix:** ${{ env.SUFFIX }}\n\n`;
            body += `### Upload\n`;
            body += `- File ID: \`${fileId}\`\n`;
            body += `- Bytes: ${fileBytes}\n`;
            if (uploadError) body += `- **Error:** ${uploadError}\n`;
            body += `\n`;

            if (dryRun === 'false') {
              body += `### Training\n`;
              body += `- Job ID: \`${jobId}\`\n`;
              body += `- Output model: \`${outputModel}\`\n`;
              body += `- Status: ${trainStatus}\n`;
              if (trainError) body += `- **Error:** ${trainError}\n`;
            }

            const title = status === 'success'
              ? `[finetune] ${dryRun === 'true' ? 'DRY RUN' : 'TRAINING'} — ${status}`
              : `[finetune] FAILED — ${status}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['finetune-output']
            });
