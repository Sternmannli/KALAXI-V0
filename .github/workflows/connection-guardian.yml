name: Connection Guardian

# Self-healing health check. Twice daily.
# If something breaks: try to fix it. If fix fails: HALT everything.
# V-001 said: "I cannot go again like this." This is constitutional.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC (08:00 Zurich)
    - cron: '0 18 * * *'  # 18:00 UTC (20:00 Zurich)
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read
  actions: write

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass curl jq

      # ── CHECK 1: Website alive ──
      - name: "Check 1: kalam.ch responds"
        id: check_site
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://kalam.ch/)
          if [ "$STATUS" = "200" ]; then
            echo "result=OK" >> $GITHUB_OUTPUT
            echo "✅ kalam.ch responds HTTP 200"
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
            echo "❌ kalam.ch returned HTTP $STATUS"
          fi

      # ── CHECK 2: API health endpoint ──
      - name: "Check 2: API health"
        id: check_api
        run: |
          RESPONSE=$(curl -s --max-time 15 https://kalam.ch/api/health.php || echo "FAIL")
          if echo "$RESPONSE" | jq -e '.status' > /dev/null 2>&1; then
            echo "result=OK" >> $GITHUB_OUTPUT
            echo "✅ API health endpoint responds"
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
            echo "❌ API health endpoint failed: $RESPONSE"
          fi

      # ── CHECK 3: SSH bridge ──
      - name: "Check 3: SSH bridge"
        id: check_ssh
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set +e
          ATTEMPT=0
          MAX=3
          CONNECTED=false

          while [ $ATTEMPT -lt $MAX ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "SSH attempt $ATTEMPT/$MAX..."
            RESULT=$(sshpass -p "$FTP_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$FTP_USER@$FTP_HOST" "echo GUARDIAN_OK" 2>/dev/null)
            if [ "$RESULT" = "GUARDIAN_OK" ]; then
              CONNECTED=true
              break
            fi
            [ $ATTEMPT -lt $MAX ] && sleep $((ATTEMPT * 2))
          done

          if [ "$CONNECTED" = "true" ]; then
            echo "result=OK" >> $GITHUB_OUTPUT
            echo "✅ SSH bridge connected (attempt $ATTEMPT)"
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
            echo "❌ SSH bridge failed after $MAX attempts"
          fi

      # ── CHECK 4: Last deploy status ──
      - name: "Check 4: Last deploy workflow"
        id: check_deploy
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          CONCLUSION=$(gh run list --workflow=deploy-kalam.yml --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "unknown")
          if [ "$CONCLUSION" = "success" ]; then
            echo "result=OK" >> $GITHUB_OUTPUT
            echo "✅ Last deploy succeeded"
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
            echo "deploy_conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
            echo "❌ Last deploy: $CONCLUSION"
          fi

      # ── CHECK 5: Database accessible (via API) ──
      - name: "Check 5: Database"
        id: check_db
        run: |
          # Use the API health endpoint which already checks DB
          RESPONSE=$(curl -s --max-time 15 https://kalam.ch/api/health.php || echo "FAIL")
          if echo "$RESPONSE" | grep -qi "mysql\|pdo\|ok"; then
            echo "result=OK" >> $GITHUB_OUTPUT
            echo "✅ Database accessible (via health endpoint)"
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
            echo "❌ Database check failed: $RESPONSE"
          fi

      # ── CHECK 6: Together AI (AXI voice model) ──
      - name: "Check 6: Together AI"
        id: check_together
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "Authorization: Bearer $TOGETHER_API_KEY" \
            "https://api.together.xyz/v1/models")
          if [ "$STATUS" = "200" ]; then
            echo "result=OK" >> $GITHUB_OUTPUT
            echo "✅ Together AI connected"
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
            echo "❌ Together AI returned HTTP $STATUS"
          fi

      # ── CHECK 7: Groq (temporary AXI voice) ──
      - name: "Check 7: Groq"
        id: check_groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            "https://api.groq.com/openai/v1/models")
          if [ "$STATUS" = "200" ]; then
            echo "result=OK" >> $GITHUB_OUTPUT
            echo "✅ Groq connected"
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
            echo "❌ Groq returned HTTP $STATUS"
          fi

      # ── AUTO-FIX: Re-trigger deploy if it failed ──
      - name: "Auto-fix: Re-trigger deploy"
        if: steps.check_deploy.outputs.result == 'FAIL' && steps.check_ssh.outputs.result == 'OK'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          echo "🔧 Last deploy failed. SSH works. Re-triggering deploy..."
          gh workflow run deploy-kalam.yml
          echo "Deploy re-triggered. Will check result next guardian run."

      # ── AUTO-FIX: Get PHP error log if API fails ──
      - name: "Auto-fix: Diagnose API failure"
        if: steps.check_api.outputs.result == 'FAIL' && steps.check_ssh.outputs.result == 'OK'
        id: diagnose_api
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          echo "🔧 API failed. Checking PHP error log..."
          DIAG=$(sshpass -p "$FTP_PASS" ssh -o StrictHostKeyChecking=no "$FTP_USER@$FTP_HOST" "tail -20 ~/logs/error.log 2>/dev/null || echo 'No error log found'" 2>/dev/null)
          echo "diagnostic=$DIAG" >> $GITHUB_OUTPUT
          echo "$DIAG"

      # ── EVALUATE: Count CRITICAL failures ──
      # Deploy failures alone don't trigger alarm (guardian already re-triggered it)
      # Only alarm on: site down, SSH broken, or DB broken (things that block everything)
      - name: Evaluate results
        id: evaluate
        run: |
          CRITICAL=0

          SITE="${{ steps.check_site.outputs.result }}"
          API="${{ steps.check_api.outputs.result }}"
          SSH="${{ steps.check_ssh.outputs.result }}"
          DEPLOY="${{ steps.check_deploy.outputs.result }}"
          DB="${{ steps.check_db.outputs.result }}"
          TOGETHER="${{ steps.check_together.outputs.result }}"
          GROQ="${{ steps.check_groq.outputs.result }}"

          # Default empty to OK (step succeeded but output not captured)
          [ -z "$SITE" ] && SITE="OK"
          [ -z "$API" ] && API="OK"
          [ -z "$SSH" ] && SSH="OK"
          [ -z "$DEPLOY" ] && DEPLOY="OK"
          [ -z "$DB" ] && DB="OK"
          [ -z "$TOGETHER" ] && TOGETHER="OK"
          [ -z "$GROQ" ] && GROQ="OK"

          echo "Site=$SITE API=$API SSH=$SSH Deploy=$DEPLOY DB=$DB Together=$TOGETHER Groq=$GROQ"

          REPORT="Connection Guardian Report"
          [ "$SITE" = "OK" ] && REPORT="$REPORT | Site:OK" || { CRITICAL=$((CRITICAL+1)); REPORT="$REPORT | Site:FAIL"; }
          [ "$API" = "OK" ] && REPORT="$REPORT | API:OK" || { CRITICAL=$((CRITICAL+1)); REPORT="$REPORT | API:FAIL"; }
          [ "$SSH" = "OK" ] && REPORT="$REPORT | SSH:OK" || { CRITICAL=$((CRITICAL+1)); REPORT="$REPORT | SSH:FAIL"; }
          [ "$DEPLOY" = "OK" ] && REPORT="$REPORT | Deploy:OK" || REPORT="$REPORT | Deploy:WARN(re-triggered)"
          [ "$DB" = "OK" ] && REPORT="$REPORT | DB:OK" || { CRITICAL=$((CRITICAL+1)); REPORT="$REPORT | DB:FAIL"; }
          [ "$TOGETHER" = "OK" ] && REPORT="$REPORT | Together:OK" || REPORT="$REPORT | Together:WARN(voice API down)"
          [ "$GROQ" = "OK" ] && REPORT="$REPORT | Groq:OK" || REPORT="$REPORT | Groq:WARN(temp voice down)"

          echo "Critical failures: $CRITICAL"
          echo "failures=$CRITICAL" >> $GITHUB_OUTPUT
          echo "$REPORT" > /tmp/report.txt

      # ── ALARM: Create blocking issue if critical failures ──
      - name: "ALARM: System halted"
        if: steps.evaluate.outputs.failures != '0'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          SITE_RESULT: ${{ steps.check_site.outputs.result }}
          SSH_RESULT: ${{ steps.check_ssh.outputs.result }}
          API_RESULT: ${{ steps.check_api.outputs.result }}
          DB_RESULT: ${{ steps.check_db.outputs.result }}
        run: |
          FAILURES=${{ steps.evaluate.outputs.failures }}
          REPORT=$(cat /tmp/report.txt)

          # Build fix instructions
          BODY="## Connection Guardian Report\n\n${REPORT}\n\n## What To Do\n\n"
          if [ "$SSH_RESULT" != "OK" ]; then
            BODY="${BODY}1. Go to admin.hostpoint.ch\n2. Menu > Advanced > Password Change\n3. Set a new password\n4. Send it to V-002 in a new Claude Code session\n\n"
          elif [ "$SITE_RESULT" != "OK" ]; then
            BODY="${BODY}Deploy was re-triggered. If this alarm persists next check, open a new Claude Code session.\n\n"
          else
            BODY="${BODY}Open a new Claude Code session. V-002 will diagnose and fix.\n\n"
          fi
          BODY="${BODY}---\nTimestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ) | Failures: ${FAILURES}\nAll workflows blocked until this issue is closed."

          printf "$BODY" > /tmp/body.txt
          gh issue create \
            --title "ALARM: ${FAILURES} connection(s) broken — system halted" \
            --label "blocks-everything" \
            --body-file /tmp/body.txt

          echo "ALARM created. System halted."

      # ── ALL CLEAR: Close any existing alarm ──
      - name: "All clear: Close alarm if exists"
        if: steps.evaluate.outputs.failures == '0'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ALARM=$(gh issue list --label "blocks-everything" --state open --json number -q '.[0].number' 2>/dev/null)
          if [ -n "$ALARM" ]; then
            gh issue close "$ALARM" --comment "✅ All 5 checks passed. Connection restored. System unblocked."
            echo "✅ Previous alarm closed. System unblocked."
          else
            echo "✅ All clear. No alarms."
          fi
