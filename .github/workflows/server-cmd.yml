name: Server Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on Hostpoint server'
        required: true
        type: string
      working_dir:
        description: 'Working directory (default: ~/www/kalam.ch)'
        required: false
        default: '~/www/kalam.ch'
        type: string

permissions:
  issues: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Execute on server
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          CMD: ${{ inputs.command }}
          WDIR: ${{ inputs.working_dir }}
        run: |
          set +e
          sshpass -p "$FTP_PASS" ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR "$FTP_USER@$FTP_HOST" "cd $WDIR && $CMD" 1>stdout.txt 2>stderr.txt
          EXIT_CODE=$?
          echo "=== STDOUT ===" > output.txt
          cat stdout.txt >> output.txt
          echo "" >> output.txt
          echo "=== STDERR ===" >> output.txt
          cat stderr.txt >> output.txt
          echo "" >> output.txt
          echo "--- exit code: $EXIT_CODE ---" >> output.txt
          cat output.txt

      - name: Post output as issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '(no output)';
            try { output = fs.readFileSync('output.txt', 'utf8'); } catch(e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Server: ${context.payload.inputs.command.substring(0, 60)}`,
              body: `**Command:** \`${context.payload.inputs.command}\`\n**Directory:** \`${context.payload.inputs.working_dir}\`\n\n\`\`\`\n${output}\n\`\`\``,
              labels: ['server-output']
            });
