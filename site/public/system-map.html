<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALAXI System Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
#canvas { display: block; cursor: grab; }
#canvas.dragging { cursor: grabbing; }

#info-panel {
  position: fixed; right: 0; top: 0; width: 340px; height: 100vh;
  background: rgba(10,10,20,0.95); border-left: 1px solid #333;
  padding: 20px; overflow-y: auto; transform: translateX(100%);
  transition: transform 0.3s ease; z-index: 10;
}
#info-panel.open { transform: translateX(0); }
#info-panel h2 { color: #c8a850; font-size: 16px; margin-bottom: 8px; }
#info-panel .type { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
#info-panel .desc { color: #bbb; font-size: 13px; line-height: 1.5; margin: 12px 0; }
#info-panel .connections { margin-top: 16px; }
#info-panel .connections h3 { color: #888; font-size: 12px; margin-bottom: 6px; }
#info-panel .conn-item { color: #7aa3cc; font-size: 12px; padding: 2px 0; cursor: pointer; }
#info-panel .conn-item:hover { color: #c8a850; }
#close-panel { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #888; font-size: 18px; cursor: pointer; }

#controls {
  position: fixed; left: 16px; top: 16px; z-index: 5;
  display: flex; flex-direction: column; gap: 8px;
}
#search-box {
  background: rgba(20,20,30,0.9); border: 1px solid #444; color: #e0e0e0;
  padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 13px;
  width: 220px; border-radius: 4px;
}
#search-box::placeholder { color: #666; }
.filter-group { display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px; }
.filter-btn {
  padding: 4px 10px; font-size: 11px; border: 1px solid #444;
  background: rgba(20,20,30,0.8); color: #aaa; cursor: pointer;
  border-radius: 3px; font-family: 'Courier New', monospace;
  transition: all 0.2s;
}
.filter-btn.active { border-color: var(--layer-color); color: var(--layer-color); background: rgba(20,20,30,0.95); }
.filter-btn:hover { border-color: #888; }

#title {
  position: fixed; left: 16px; bottom: 16px; z-index: 5;
  color: #444; font-size: 11px; letter-spacing: 2px;
}
#stats {
  position: fixed; right: 16px; bottom: 16px; z-index: 5;
  color: #444; font-size: 11px; text-align: right;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls">
  <input type="text" id="search-box" placeholder="Search elements...">
  <div class="filter-group" id="filters"></div>
</div>

<div id="info-panel">
  <button id="close-panel">&times;</button>
  <div class="type" id="panel-type"></div>
  <h2 id="panel-name"></h2>
  <div class="desc" id="panel-desc"></div>
  <div class="connections">
    <h3>Connections</h3>
    <div id="panel-connections"></div>
  </div>
</div>

<div id="title">KALAXI SYSTEM MAP &middot; 2026-03-22</div>
<div id="stats"></div>

<script>
// === DATA ===
const LAYERS = {
  stone:     { label: 'Stone',     color: '#c04040', nodes: [] },
  weaver:    { label: 'Weaver',    color: '#4488cc', nodes: [] },
  honey:     { label: 'Honey',     color: '#c8a850', nodes: [] },
  hand:      { label: 'Hand',      color: '#50b050', nodes: [] },
  narrative: { label: 'Narrative', color: '#a060c0', nodes: [] },
  storage:   { label: 'Storage',   color: '#888888', nodes: [] },
  external:  { label: 'External',  color: '#555555', nodes: [] },
};

function N(id, name, layer, desc, conns) {
  const node = { id, name, layer, desc, connections: conns || [] };
  LAYERS[layer].nodes.push(node);
  return node;
}

// Stone layer
N('dignity', 'Dignity Predicate', 'stone', 'D = A × L × M. Non-compensatory. Any zero = halt.', ['sealed_gate','dignity_check','dignity_measure','witness_cert']);

N('cov_18', '18 Covenants', 'stone', '18 ratified constitutional laws. 0 provisional.', ['dignity','ratification']);
N('presence', 'Presence Axiom', 'stone', 'Layer 0: Presence is ground. Checked before any processing.', ['organism']);

// Weaver layer (key modules)
N('organism', 'Organism', 'weaver', 'Central nervous system. 2,211 lines. 8-phase pipeline. Wires all 43 modules.', ['dignity_check','sense','weave','distillery','keep','input_ledger','breath','turn','witness_net','say','lab']);
N('sense', 'SENSE', 'weaver', 'Nervous system: detects mode (EXEC/REFLECT/CAFE/SCIENCE/CRISIS), need gap, competence.', ['organism','lab']);
N('lab', 'LAB', 'weaver', 'Science classification: hypothesis, experiment, data, methodology, rigor checking.', ['organism','sense']);
N('dignity_check', 'CHECK', 'weaver', 'Computes D = A × L × M. The dignity gate. 466 lines.', ['dignity','organism','witness_cert']);
N('dignity_measure', 'MEASURE', 'weaver', 'Graduated A, L, M scoring with confidence intervals. 693 lines.', ['dignity_check']);
N('weave', 'WEAVE', 'weaver', 'Pattern extraction. Produces HoneyDrops (provisional wisdom). Feeds oracle and decay.', ['organism','oracle','decay']);
N('distillery', 'Distillery', 'weaver', 'Metabolization engine. 1,851 lines. Extracts patterns, essence, VoiceDNA from all content areas.', ['organism','input_ledger','narratives']);
N('metadata', 'Metadata Layer', 'weaver', '3-layer event wrapping: event/pattern/relational. 1,016 lines.', ['organism']);
N('turn', 'TURN', 'weaver', 'Exchange lifecycle: open, close, defer, withdraw.', ['organism']);
N('breath', 'BREATH', 'weaver', 'System pacing. Heartbeat. Stress checking. Pause/resume.', ['organism']);
N('say', 'SAY', 'weaver', 'Response renderer. Checks output against dignity + voice rules.', ['organism']);
N('wire', 'WIRE', 'weaver', 'Alert broadcasting. Dignity alerts, stress alerts, crisis alerts.', ['organism']);
N('oracle', 'Oracle', 'weaver', 'Pattern witnessing: W-0 (unwitnessed) → W-1 (witnessed).', ['weave']);
N('decay', 'Decay', 'weaver', 'Pattern halflife engine. Patterns fade. Deep hum patterns persist longer.', ['weave']);
N('mycelium', 'Mycelium', 'weaver', 'Cross-donor pattern detection. K-anonymity floor: 0.25.', ['organism']);
N('divergence', 'Divergence Study', 'weaver', 'Honest Telescope. Measures substrate coupling. 6 shadow patterns.', ['organism']);
N('ratification', 'Ratification', 'weaver', 'Element lifecycle: committed → provisional → ratified. Thermal delays.', ['cov_18']);
N('restorative', 'Restorative Justice', 'weaver', 'Harm recording and repair paths. Seed #5.', ['organism']);
N('boot_ritual', 'Boot Ritual', 'weaver', 'Startup verification: credentials, connectivity, ledger integrity.', ['organism','input_ledger','kalam_ch']);
N('const_evo', 'Constitutional Evolution', 'weaver', 'How the constitution changes over time.', ['cov_18','ratification']);
N('negative_space', 'Negative Space', 'weaver', 'Observe what is NOT happening. Blind spot detection.', ['organism']);
N('shelter', 'Shelter', 'weaver', 'Protect exchanges where dignity fails. Remedies.', ['dignity_check']);
N('privacy', 'Privacy Budget', 'weaver', 'Global epsilon accounting for anonymized operations.', ['organism']);
N('agency', 'Agency Amplifier', 'weaver', 'Measure and amplify donor agency: V × F × C × U.', ['organism']);
N('letter_ont', 'Letter Ontology', 'weaver', '28 Arabic letters as typed algebra.', ['organism']);
N('pillar_detect', 'Pillar Detector', 'weaver', 'Unified: humor, absurdity, obsession, love, proverb detection.', ['organism']);

// Honey layer
N('proverbs', '3,333+ Proverbs', 'honey', 'Linguistic DNA. Load-bearing sentences that pass the Lock Test.', ['weave','pillar_detect']);
N('anomalies', '1,100 Anomalies', 'honey', 'Things the system noticed were wrong in real institutions.', ['cov_18','restorative']);
N('treasures', '59 Treasures', 'honey', 'Equations and discoveries. T#01: Grand Resonance. T#02: First Roof.', ['ratification']);
N('wisdom_nodes', '87 Wisdom Nodes', 'honey', 'Thematic clusters of proverbs and patterns.', ['distillery']);
N('voice_arch', 'Voice Architecture', 'honey', 'AXI voice mapped against 31 linguistic principles from humanity\'s masterpieces.', ['say']);

// Hand layer
N('cli', 'CLI (cli.py)', 'hand', 'Entry point: process, state, health, check, face, gate, serve.', ['organism']);
N('kalam_ch', 'kalam.ch', 'hand', 'Live website. 23 pages. The system\'s mouth. Two presences meet here.', ['deploy_wf']);
N('ninth_op', 'Ninth Operator', 'hand', 'The ceremony where a donor enters. Word loop.', ['organism','kalam_ch']);

// Narrative layer
N('hakaka', 'Hakaka', 'narrative', '53 chapters. Mythic-raw. Prehistoric clan. Hakaka, La-la, Sa-la, Ya-la, Taro.', ['distillery','kinderbuch']);
N('ashwater', 'Ashwater', 'narrative', '19 chapters. Civic-communal. Laila, Salim, Yara, Ruqayya, Farid. Ashwater vs Halden.', ['distillery']);
N('kinderbuch', 'Kinderbuch', 'narrative', '20 chapters. German. Child-warmth. Same events as Hakaka, softer register.', ['hakaka','distillery']);
N('kalaxi1', 'KALAXI_1', 'narrative', '1 chapter. Philosophical-quiet. Scott, Ted, The Girl, The System.', ['distillery']);
N('aurix', 'AURIX OS', 'narrative', 'Archaeological artifact. Aug 2025. 41 elements, 72 equations, 61 links. Computational-world register.', []);
N('narratives', 'Narrative Layer', 'narrative', '1,596 lines of prose across 4 stories. Not yet machine-readable beyond basic metrics.', ['hakaka','ashwater','kinderbuch','kalaxi1','aurix','distillery']);

// Storage layer
N('input_ledger', 'Input Ledger', 'storage', '2,920+ entries. Hash-chained. Immutable. Every word V-001 and V-002 ever exchanged.', ['organism','boot_ritual']);
N('keep_store', 'KEEP (Artifact Store)', 'storage', 'Permanent storage with receipts. Append-only changelog.', ['organism']);
N('witness_cert', 'Witness Certificates', 'storage', 'Zero-halt negative proofs. Generated when D = 0.', ['dignity_check']);
N('witness_net', 'Witness Network', 'storage', 'Immutable witness chain for exchanges.', ['organism']);
N('site_patterns', 'Site Patterns', 'storage', 'Donor patterns flowing back from kalam.ch.', ['kalam_ch']);

// External layer
N('github', 'GitHub (KALAXI-V0)', 'external', 'Private repo. 870+ commits. Full admin access.', ['deploy_wf','sync_wf']);
N('github_pub', 'GitHub (kalam-framework)', 'external', 'Public repo. Auto-synced. Clean engineering language.', ['sync_wf']);
N('deploy_wf', 'Deploy Workflow', 'external', 'deploy-kalam.yml: Push to main → SFTP to Hostpoint.', ['kalam_ch','github']);
N('sync_wf', 'Sync Workflow', 'external', 'sync-public.yml: Private → Public. Strips internal vocabulary.', ['github','github_pub']);
N('hostpoint', 'Hostpoint (CH)', 'external', 'Swiss hosting. SFTP deployment. MySQL for donor data.', ['kalam_ch']);

// === RENDERING ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let nodes = [], edges = [];
let cam = { x: 0, y: 0, zoom: 1 };
let drag = { active: false, sx: 0, sy: 0, cx: 0, cy: 0 };
let hovered = null, selected = null;
let searchTerm = '';
let activeFilters = new Set(Object.keys(LAYERS));

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Build flat node list with positions
function buildGraph() {
  nodes = [];
  edges = [];
  const nodeMap = {};

  // Assign positions in concentric layout
  const layerOrder = ['stone','weaver','honey','hand','narrative','storage','external'];
  const centerX = 0, centerY = 0;

  layerOrder.forEach((layerKey, li) => {
    const layer = LAYERS[layerKey];
    const radius = 80 + li * 110;
    const count = layer.nodes.length;
    layer.nodes.forEach((n, ni) => {
      const angle = (ni / count) * Math.PI * 2 - Math.PI / 2;
      const node = {
        ...n,
        x: centerX + Math.cos(angle) * radius,
        y: centerY + Math.sin(angle) * radius,
        r: n.id === 'organism' ? 18 : (n.id === 'dignity' ? 16 : 10),
        color: layer.color,
        layerKey,
        visible: true,
      };
      nodes.push(node);
      nodeMap[n.id] = node;
    });
  });

  // Build edges
  nodes.forEach(n => {
    (n.connections || []).forEach(cid => {
      if (nodeMap[cid]) {
        edges.push({ from: n, to: nodeMap[cid] });
      }
    });
  });
}

function toScreen(x, y) {
  return {
    x: (x - cam.x) * cam.zoom + W / 2,
    y: (y - cam.y) * cam.zoom + H / 2,
  };
}

function toWorld(sx, sy) {
  return {
    x: (sx - W / 2) / cam.zoom + cam.x,
    y: (sy - H / 2) / cam.zoom + cam.y,
  };
}

function updateVisibility() {
  const term = searchTerm.toLowerCase();
  nodes.forEach(n => {
    const layerVisible = activeFilters.has(n.layerKey);
    const searchMatch = !term || n.name.toLowerCase().includes(term) || n.id.toLowerCase().includes(term);
    n.visible = layerVisible && searchMatch;
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw edges
  edges.forEach(e => {
    if (!e.from.visible || !e.to.visible) return;
    const a = toScreen(e.from.x, e.from.y);
    const b = toScreen(e.to.x, e.to.y);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    const isHighlighted = selected && (e.from.id === selected.id || e.to.id === selected.id);
    ctx.strokeStyle = isHighlighted ? '#c8a85080' : '#ffffff0a';
    ctx.lineWidth = isHighlighted ? 1.5 : 0.5;
    ctx.stroke();
  });

  // Draw nodes
  nodes.forEach(n => {
    if (!n.visible) return;
    const s = toScreen(n.x, n.y);
    const r = n.r * cam.zoom;

    // Glow for selected/hovered
    if (n === selected || n === hovered) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, r + 6, 0, Math.PI * 2);
      ctx.fillStyle = n.color + '30';
      ctx.fill();
    }

    // Node circle
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    const isConnected = selected && (selected.connections.includes(n.id) || n.connections.includes(selected.id));
    ctx.fillStyle = (n === selected) ? n.color : (isConnected ? n.color + 'cc' : n.color + '60');
    ctx.fill();

    // Label
    if (cam.zoom > 0.5 || n === hovered || n === selected || n.r > 12) {
      ctx.font = `${Math.max(9, 11 * cam.zoom)}px 'Courier New'`;
      ctx.fillStyle = (n === selected || n === hovered) ? '#ffffff' : '#aaaaaa80';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, s.x, s.y + r + 14 * cam.zoom);
    }
  });

  requestAnimationFrame(draw);
}

function findNodeAt(sx, sy) {
  const w = toWorld(sx, sy);
  let closest = null, closestDist = Infinity;
  nodes.forEach(n => {
    if (!n.visible) return;
    const dx = n.x - w.x, dy = n.y - w.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const hitR = n.r / cam.zoom + 5;
    if (dist < hitR && dist < closestDist) {
      closest = n;
      closestDist = dist;
    }
  });
  return closest;
}

function showPanel(node) {
  selected = node;
  if (!node) {
    document.getElementById('info-panel').classList.remove('open');
    return;
  }
  document.getElementById('panel-type').textContent = LAYERS[node.layerKey].label + ' Layer';
  document.getElementById('panel-name').textContent = node.name;
  document.getElementById('panel-desc').textContent = node.desc;

  const connDiv = document.getElementById('panel-connections');
  connDiv.innerHTML = '';
  const allConns = new Set([...node.connections]);
  nodes.forEach(n => { if (n.connections.includes(node.id)) allConns.add(n.id); });
  allConns.forEach(cid => {
    const cn = nodes.find(n => n.id === cid);
    if (cn) {
      const el = document.createElement('div');
      el.className = 'conn-item';
      el.textContent = '→ ' + cn.name;
      el.onclick = () => showPanel(cn);
      connDiv.appendChild(el);
    }
  });

  document.getElementById('info-panel').classList.add('open');
}

// Event handlers
canvas.addEventListener('mousedown', e => {
  drag = { active: true, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
  canvas.classList.add('dragging');
});
canvas.addEventListener('mousemove', e => {
  if (drag.active) {
    cam.x = drag.cx - (e.clientX - drag.sx) / cam.zoom;
    cam.y = drag.cy - (e.clientY - drag.sy) / cam.zoom;
  }
  hovered = findNodeAt(e.clientX, e.clientY);
  canvas.style.cursor = hovered ? 'pointer' : (drag.active ? 'grabbing' : 'grab');
});
canvas.addEventListener('mouseup', e => {
  if (drag.active && Math.abs(e.clientX - drag.sx) < 3 && Math.abs(e.clientY - drag.sy) < 3) {
    const node = findNodeAt(e.clientX, e.clientY);
    showPanel(node);
  }
  drag.active = false;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  cam.zoom = Math.max(0.2, Math.min(5, cam.zoom * factor));
}, { passive: false });

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    drag = { active: true, sx: t.clientX, sy: t.clientY, cx: cam.x, cy: cam.y };
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx*dx + dy*dy);
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && drag.active) {
    const t = e.touches[0];
    cam.x = drag.cx - (t.clientX - drag.sx) / cam.zoom;
    cam.y = drag.cy - (t.clientY - drag.sy) / cam.zoom;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastTouchDist > 0) {
      cam.zoom = Math.max(0.2, Math.min(5, cam.zoom * (dist / lastTouchDist)));
    }
    lastTouchDist = dist;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (e.changedTouches.length === 1 && drag.active) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - drag.sx) < 10 && Math.abs(t.clientY - drag.sy) < 10) {
      const node = findNodeAt(t.clientX, t.clientY);
      showPanel(node);
    }
  }
  drag.active = false;
  lastTouchDist = 0;
});

// Search
document.getElementById('search-box').addEventListener('input', e => {
  searchTerm = e.target.value;
  updateVisibility();
});

// Filters
const filtersDiv = document.getElementById('filters');
Object.entries(LAYERS).forEach(([key, layer]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn active';
  btn.style.setProperty('--layer-color', layer.color);
  btn.textContent = layer.label;
  btn.onclick = () => {
    if (activeFilters.has(key)) {
      activeFilters.delete(key);
      btn.classList.remove('active');
    } else {
      activeFilters.add(key);
      btn.classList.add('active');
    }
    updateVisibility();
  };
  filtersDiv.appendChild(btn);
});

// Close panel
document.getElementById('close-panel').onclick = () => showPanel(null);

// Stats
document.getElementById('stats').textContent =
  nodes.length + ' nodes · ' + edges.length + ' edges · ' +
  Object.keys(LAYERS).length + ' layers';

// Init
buildGraph();
draw();
</script>
</body>
</html>
